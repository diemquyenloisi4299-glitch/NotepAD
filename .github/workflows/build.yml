name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cài đặt Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cài đặt Flet 0.28.3 (Bản ổn định tương thích 100% với code)
      run: |
        python -m pip install --upgrade pip
        pip install "flet[all]==0.28.3"

    - name: Dọn dẹp file cấu hình thừa
      run: |
        rm -f requirements.txt
        rm -f pyproject.toml
        rm -f Pipfile

    - name: Build APK (Tự động xác nhận Y để không bị kẹt)
      run: yes "y" | flet build apk

    - name: Tải file APK lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Quick-Note-App-APK
        path: build/apk/**/*.apk
