name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cài đặt chuẩn Flutter 3.24.3
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'

    - name: Cài đặt Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cài đặt Flet CLI 1.0.4
      run: |
        python -m pip install --upgrade pip
        pip install flet==1.0.4

    - name: ÉP XÓA CÁC FILE GÂY XUNG ĐỘT TRƯỚC KHI BUILD
      run: |
        rm -f requirements.txt
        rm -f pyproject.toml
        rm -f Pipfile

    - name: Build APK
      run: flet build apk

    - name: Tải file APK lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Quick-Note-App-APK
        path: build/apk/**/*.apk
